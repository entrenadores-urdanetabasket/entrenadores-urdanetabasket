    <circle r="40" stroke-width="2.5" opacity="0"><animate attributeName="r" values="40;130" dur="4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle r="40" stroke-width="2.5" opacity="0"><animate attributeName="r" values="40;130" dur="4s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle>
  </g>
