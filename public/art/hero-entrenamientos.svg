    <path d="M320 112l11 22h-22z"/><path d="M460 102l11 22h-22z"/><path d="M390 202l11 22h-22z" fill-opacity="0.8"/><path d="M250 214l11 22h-22z" fill-opacity="0.8"/><path d="M530 192l11 22h-22z" fill-opacity="0.8"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.35" stroke-width="2"><path d="M312 134h16M452 124h16M382 224h16M242 236h16M522 214h16"/></g>
