<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" fill="none">
  <defs>
    <radialGradient id="b" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffb066"/><stop offset="0.55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
  </defs>
  <!-- Cronómetro -->
  <g transform="translate(490 62)">
    <circle r="30" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M-8 -38h16" stroke="#fff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0V-20" stroke="#ffb066" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></path>
    <circle r="3.5" fill="#ffb066"/>
  </g>
  <!-- Recorrido en zig-zag con conos -->
  <path d="M250 232L320 130L390 220L460 120L530 210" stroke="#fff" stroke-opacity="0.2" stroke-width="2.4" stroke-dasharray="3 9" stroke-linecap="round" pathLength="1000">
