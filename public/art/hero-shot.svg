<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" fill="none">
  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Líneas de pista: se dibujan al entrar -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.3 0.6 0.2 1" keyTimes="0;1"/>
    <path pathLength="1" d="M530 20V260"/>
    <path pathLength="1" d="M530 24H490A94 94 0 0 0 490 212H530"/>
    <path pathLength="1" d="M530 78H410V158H530"/>
    <path pathLength="1" d="M410 84A34 34 0 0 0 410 152"/>
    <path pathLength="1" d="M410 84A34 34 0 0 1 410 152" stroke-dasharray="0.04 0.04"/>
    <path pathLength="1" d="M410 20V260" stroke-opacity="0.5"/>
    <path pathLength="1" d="M530 118H520"/>
  </g>

  <!-- Jugadores (puntos) -->
  <g fill="#ffffff">
    <circle cx="330" cy="62" r="6" fill-opacity="0.22"><animate attributeName="r" values="6;8;6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="190" r="6" fill-opacity="0.22"><animate attributeName="r" values="6;8;6" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="256" cy="130" r="6" fill-opacity="0.16"><animate attributeName="r" values="6;8;6" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Estela del tiro -->
  <path d="M250 228 Q380 36 503 118" stroke="#ff9a3c" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 9" pathLength="1000">
    <animate attributeName="stroke-opacity" values="0;0.55;0.55;0;0" keyTimes="0;0.04;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Canasta -->
  <path d="M520 100V136" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="503" cy="118" r="26" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.38;0.43;0.6;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="503" cy="118" r="8.5" stroke="#ff7a1a" stroke-width="2.6">
    <animate attributeName="r" values="8.5;8.5;11;8.5;8.5" keyTimes="0;0.4;0.45;0.55;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Balón -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.4;0.46;1" dur="6s" repeatCount="indefinite"/>
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.4;1" path="M250 228 Q380 36 503 118"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.8;1;0.7;0.7" keyTimes="0;0.2;0.4;0.46;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <circle r="11" fill="url(#ball)"/>
        <g stroke="#7a2e08" stroke-opacity="0.75" stroke-width="1.1">
          <circle r="11"/>
          <path d="M-11 0H11M0 -11V11"/>
          <path d="M-7.8 -7.8Q0 0 -7.8 7.8M7.8 -7.8Q0 0 7.8 7.8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
