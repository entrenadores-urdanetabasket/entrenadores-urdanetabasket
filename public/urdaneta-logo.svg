<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 262" width="210" height="262">
  <defs>
    <clipPath id="sc">
      <path d="M9,9 Q9,3 15,3 L195,3 Q201,3 201,9 L201,158 Q201,210 105,258 Q9,210 9,158 Z"/>
    </clipPath>
  </defs>

  <!-- Shield fill -->
  <path d="M9,9 Q9,3 15,3 L195,3 Q201,3 201,9 L201,158 Q201,210 105,258 Q9,210 9,158 Z"
        fill="#52B043"/>

  <!-- Top dark banner (clipped to shield) -->
  <rect x="0" y="0" width="210" height="64" fill="#1C5C2A" clip-path="url(#sc)"/>

  <!-- Shield outer border -->
  <path d="M9,9 Q9,3 15,3 L195,3 Q201,3 201,9 L201,158 Q201,210 105,258 Q9,210 9,158 Z"
        fill="none" stroke="#1C5C2A" stroke-width="9"/>

  <!-- Banner / body separator line -->
  <line x1="9" y1="63" x2="201" y2="63" stroke="#1C5C2A" stroke-width="2" clip-path="url(#sc)"/>

  <!-- CLUB DEPORTIVO -->
  <text x="105" y="41"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="16" font-weight="900" fill="white" letter-spacing="1.8">
    CLUB DEPORTIVO
  </text>

  <!-- Urdaneta -->
  <text x="105" y="100"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="37" font-style="italic" font-weight="bold" fill="white">
    Urdaneta
  </text>

  <!-- ── Apple / heart icon ─────────────────────────── -->

  <!-- Hollow heart outline -->
  <path d="M105,222
           C 80,203 52,182 51,160
           C 50,140 62,128 78,128
           C 90,128 99,138 105,147
           C 111,138 120,128 132,128
           C 148,128 160,140 159,160
           C 158,182 130,203 105,222 Z"
        fill="none" stroke="white" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- Small teardrop / flame on top -->
  <path d="M105,124 C102,114 93,106 105,101 C117,106 108,114 105,124 Z"
        fill="white"/>

  <!-- Small decorative arc at bottom (cup) -->
  <path d="M82,224 Q105,236 128,224"
        fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Pencil — diagonal from lower-left to upper-right through heart -->
  <!-- Pencil body (rounded rect rotated ~-40deg, centered ~(100,175)) -->
  <g transform="translate(105,175) rotate(-40)">
    <!-- Body -->
    <rect x="-5" y="-46" width="10" height="84" rx="3" fill="white"/>
    <!-- Eraser end (top) -->
    <rect x="-5" y="-50" width="10" height="8" rx="2" fill="#d0d0d0"/>
    <!-- Tip -->
    <polygon points="-5,38 5,38 0,52" fill="white"/>
  </g>

</svg>
